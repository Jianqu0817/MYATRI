[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myatri"
version = "0.3.0"
description = "Persistent evidence-grounded character memory and gradual persona evolution"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "aiohttp>=3.11.18,<4",
    "numpy>=2,<3",
    "igraph>=0.11,<2",
    "leidenalg>=0.10,<1",
    "jsonschema>=4.23,<5",
    "scikit-learn>=1.5,<2",
    "tzdata>=2025.1",
    "scipy>=1.13,<1.16",
]

[project.scripts]
myatri = "myatri.interfaces.cli:main"

[project.optional-dependencies]
neural = [
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "build>=1.2,<2",
    "hatchling>=1.32.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build]
exclude = [
    "/var", "/.venv", "/dist", "**/__pycache__", "**/*.pyc",
    "**/*.local.json",
    "/reports/*_tmp*/**", "/reports/fix_context_tmp_20261020/**",
    "/reports/package_smoke_0.1.1.json",
    "/reports/emotion_package_smoke.json",
    # The artifact digest report cannot be included in the artifact it hashes.
    "/reports/upstream_package_check.json",
    "**/.env", "**/.env.*", "**/*.local.toml", "**/credentials.json", "**/credentials.toml",
    "**/secrets.json", "**/secrets.toml", "**/api_key.txt", "**/api-key.txt", "**/*.credential",
    "**/*.credential.json", "**/*.pem", "**/*.pfx", "**/*.p12", "**/*.key",
    "**/credentials/**", "**/.credentials/**", "**/secrets/**", "**/.secrets/**",
    "**/.[eE][nN][vV]*", "**/*.[lL][oO][cC][aA][lL].[tT][oO][mM][lL]",
    "**/[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL][sS].[jJ][sS][oO][nN]",
    "**/[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL][sS].[tT][oO][mM][lL]",
    "**/[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL][sS].[yY][aA][mM][lL]",
    "**/[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL][sS].[yY][mM][lL]",
    "**/[sS][eE][cC][rR][eE][tT][sS].[jJ][sS][oO][nN]",
    "**/[sS][eE][cC][rR][eE][tT][sS].[tT][oO][mM][lL]",
    "**/[sS][eE][cC][rR][eE][tT][sS].[yY][aA][mM][lL]",
    "**/[sS][eE][cC][rR][eE][tT][sS].[yY][mM][lL]",
    "**/*.[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL]",
    "**/*.[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL].[jJ][sS][oO][nN]",
    "**/*.[pP][eE][mM]", "**/*.[pP][fF][xX]", "**/*.[pP]12", "**/*.[kK][eE][yY]",
    "**/[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL][sS]/**",
    "**/.[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL][sS]/**",
    "**/[sS][eE][cC][rR][eE][tT][sS]/**", "**/.[sS][eE][cC][rR][eE][tT][sS]/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/config/harness", "/src", "/prompts", "/config/defaults.toml", "/config/schedules.toml", "/config/cli-engine.toml", "/Monitor-Context.cmd", "/View-Context.cmd", "/Harness.cmd",
    "/config/persona_template.md", "/config/live.example.toml", "/config/personas", "/docs", "/tests", "/scripts",
    "/reports", "/evals", "/LICENSES", "/THIRD_PARTY_NOTICES.md", "/README.md", "/情绪模块开发.md", "/启动MYATRI.cmd", "/启动小温暖.cmd", "/pyproject.toml", "/uv.lock", "/.gitignore", "/.gitattributes",
]

[tool.hatch.build.targets.wheel]
packages = ["src/myatri"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSES/upstream" = "myatri/_vendor/upstream"
"prompts" = "myatri/prompts"
"config/defaults.toml" = "myatri/config/defaults.toml"
"config/schedules.toml" = "myatri/config/schedules.toml"
"config/persona_template.md" = "myatri/config/persona_template.md"
"config/live.example.toml" = "myatri/config/live.example.toml"
"config/personas/xiaowennuan/persona.md" = "myatri/config/personas/xiaowennuan/persona.md"
"config/personas/xiaowennuan/source.md" = "myatri/config/personas/xiaowennuan/source.md"
"config/personas/xiaowennuan/README.md" = "myatri/config/personas/xiaowennuan/README.md"
"config/personas/xiaowennuan/style_update_2026-10-21.md" = "myatri/config/personas/xiaowennuan/style_update_2026-10-21.md"

"config/cli-engine.toml" = "myatri/config/cli-engine.toml"
"docs/companion_port_source.json" = "myatri/companion/port_source.json"
